name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  XCODE: /Applications/Xcode_16.4.app

jobs:
  build-ipa:
    name: Build unsigned IPA (iOS 12+)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (arm64, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PodTube.xcodeproj -scheme PodTube -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -100 || true

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          ls -la "$APP"
          echo "--- Frameworks:"; ls -la "$APP/Frameworks" 2>/dev/null || echo "(none)"
          echo "--- Mach-O:"; file "$APP/PodTube"; xcrun vtool -show-build "$APP/PodTube" | head -12
          echo "--- linked libraries:"; xcrun otool -L "$APP/PodTube" | tail -n +2 | awk '{print $1}'
          echo "--- minimum OS of bundled dylibs (must all be <= 12.0):"
          for f in "$APP"/Frameworks/*.dylib; do echo "$(basename "$f"): $(xcrun vtool -show-build "$f" | grep -m1 minos)"; done
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PodTube-unsigned.ipa Payload
          ls -lh PodTube-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PodTube-ipa
          path: PodTube-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" PodTube-unsigned.ipa \
            --title "PodTube ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md --generate-notes

  ui-smoke:
    name: Simulator smoke test (screenshots)
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project PodTube.xcodeproj -scheme PodTube -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-sim.log

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" build-sim.log | sort -u | head -100 || true

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone SE \(3rd generation\)" | head -1 | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "UDID=$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Take screenshots
        continue-on-error: true
        run: bash Tools/ci_screenshots.sh build-sim/Build/Products/Debug-iphonesimulator/PodTube.app "$UDID"

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p shots/crash
          cp ~/Library/Logs/DiagnosticReports/PodTube* shots/crash/ 2>/dev/null || true
          ls shots/crash || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
