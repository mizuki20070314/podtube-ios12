name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  XCODE: /Applications/Xcode_16.4.app

jobs:
  build-ipa:
    name: Build unsigned IPA (iOS 12+)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (arm64, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PodTube.xcodeproj -scheme PodTube -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -100 || true

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          ls -la "$APP"
          echo "--- Frameworks:"; ls -la "$APP/Frameworks" 2>/dev/null || echo "(none)"
          echo "--- Mach-O:"; file "$APP/PodTube"; xcrun vtool -show-build "$APP/PodTube" | head -12
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PodTube-unsigned.ipa Payload
          ls -lh PodTube-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PodTube-ipa
          path: PodTube-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" PodTube-unsigned.ipa \
            --title "PodTube ${GITHUB_REF_NAME}" --generate-notes
